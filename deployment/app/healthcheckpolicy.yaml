---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: koina-svc
  namespace: koina
spec:
  targetRef:
    group: ""
    kind: Service
    name: koina-svc
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_FIXED_PORT
        port: 8501
        requestPath: /v2/health/ready
