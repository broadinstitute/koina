apiVersion: apps/v1
kind: Deployment
metadata: # kpt-merge: /koina
  annotations:
    internal.kpt.dev/upstream-identifier: apps/v1|Deployment|koina|koina
  name: koina
  namespace: koina
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koina
  template:
    metadata:
      labels:
        app: koina
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      containers:
        - name: koina
          image: ghcr.io/wilhelm-lab/koina:latest
          env:
            - name: MODEL_PATTERN
              value: "Prosit_2019*"
          ports:
            - name: grpc
              containerPort: 8500
              protocol: TCP
            - name: http
              containerPort: 8501
              protocol: TCP
            - name: metrics
              containerPort: 8502
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 30
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 30
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
